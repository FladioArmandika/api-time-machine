name: Update data

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Pinned: config/severity-levels.txt is generated from this version's rule list.
      - name: Install oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@v1.33.0
          echo "OASDIFF=$(go env GOPATH)/bin/oasdiff" >> "$GITHUB_ENV"

      # Blobless clones of the vendor spec repos. Restoring yesterday's copy turns a full clone into a fetch.
      - uses: actions/cache@v4
        with:
          path: .cache/repos
          key: spec-repos-${{ github.run_id }}
          restore-keys: spec-repos-

      - name: Run pipeline
        working-directory: pipeline
        env:
          CONCURRENCY: 2
          OASDIFF_MAX_GB: 10
        run: |
          npm ci
          npm run build

      # meta.json changes on every run; only commit when the data itself moved.
      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain -- data ':!data/meta.json')" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "Fladio Armandika"
          git config user.email "12187126+FladioArmandika@users.noreply.github.com"
          git add data
          git commit -m "Update data $(date -u +%F)"
          git push
